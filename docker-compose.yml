version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careerpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: cp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: cp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: cp-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: cp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: careerpilot
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: careerpilot-resumes
      JWT_SECRET_KEY: default-very-secure-secret-key-that-is-at-least-256-bits-long-careerpilot-os-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: cp-ai-service
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: mock
      JWT_SECRET_KEY: default-very-secure-secret-key-that-is-at-least-256-bits-long-careerpilot-os-2026
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: cp-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cp-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai-service
      - frontend

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
