global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'careerpilot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'careerpilot-ai-service'
    metrics_path: '/api/v1/ai/metrics/prometheus'
    static_configs:
      - targets: ['ai-service:8000']
